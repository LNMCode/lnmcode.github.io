name: Deploy GitHub Pages

on:
  push:
    branches: [dev_pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/dev_pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify HSK 1
        run: node --test tests/hsk1/*.test.cjs
      - name: Package static site
        run: |
          mkdir -p "$RUNNER_TEMP/pages/learning"
          cp -R index.html privacy-policy.html app-ads.txt assets pictures .nojekyll "$RUNNER_TEMP/pages/"
          cp -R learning/hsk1 "$RUNNER_TEMP/pages/learning/"
          sed "s/^const VERSION = .*/const VERSION = '${GITHUB_SHA}';/" learning/hsk1/sw.js > "$RUNNER_TEMP/pages/learning/hsk1/sw.js"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
