<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c1520">
  <meta name="description" content="Đi qua những con đường đèn lồng, ghi nhớ chữ Hán theo địa điểm và dùng 300 từ HSK 1 để mở lối.">
  <meta name="apple-mobile-web-app-title" content="Hán Ngữ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" sizes="192x192" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Hán Ngữ Phiêu Lưu · HSK 1</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./arcade/cinema.css">
  <link rel="stylesheet" href="./arcade/arcade.css">
  <link rel="stylesheet" href="./arcade/pinyin.css">
  <link rel="stylesheet" href="./arcade/strokes.css">
  <link rel="stylesheet" href="./arcade/memory-games.css">
  <link rel="stylesheet" href="./arcade/wind.css">
  <link rel="stylesheet" href="./arcade/echo.css">
  <link rel="stylesheet" href="./arcade/riddle.css">
  <link rel="stylesheet" href="./arcade/lights.css">
  <style>
    .startup-panel { padding: 28px; text-align: center; }
    .startup-panel p { margin: 12px auto; max-width: 35ch; }
    #hsk1-update:not([hidden]) {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 14px;
      max-width: 575px;
      margin: auto;
      padding: calc(8px + env(safe-area-inset-top)) 18px 8px;
      background: #17283a;
      color: #e9f2f3;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!document.getElementById('hsk1-loading')) return;
      document.getElementById('hsk1-load-status').textContent =
        'Chưa mở được trò chơi. Hãy kết nối mạng rồi tải lại trang.';
      const reloadButton = document.getElementById('hsk1-reload');
      reloadButton.hidden = false;
      reloadButton.addEventListener('click', () => location.reload());
    }, { once: true });
  </script>
  <script src="./boot.js" defer></script>
  <script src="./data.js" defer></script>
  <script src="./engine.js" defer></script>
  <script src="./arcade/catalog.js" defer></script>
  <script src="./arcade/visual.js" defer></script>
  <script src="./arcade/strokes-data.js" defer></script>
  <script src="./arcade/pinyin.js" defer></script>
  <script src="./arcade/strokes.js" defer></script>
  <script src="./arcade/pairs.js" defer></script>
  <script src="./arcade/flow.js" defer></script>
  <script src="./arcade/wind.js" defer></script>
  <script src="./arcade/echo.js" defer></script>
  <script src="./arcade/riddle.js" defer></script>
  <script src="./arcade/lights.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <canvas id="hsk-cinema" aria-hidden="true" data-visual="2d"></canvas>
  <section id="hsk1-update" hidden aria-label="Cập nhật trò chơi">
    <span id="hsk1-update-text" role="status">Đã tải bản cập nhật.</span>
    <button class="btn button-soft" type="button">Mở bản mới</button>
  </section>
  <div id="app">
    <div id="hsk1-loading" class="loading startup-panel">
      <span aria-hidden="true">🌿</span>
      <p id="hsk1-load-status" role="status">Đang mở Hán Ngữ Phiêu Lưu…</p>
      <button id="hsk1-reload" class="btn primary" type="button" hidden>Tải lại trang</button>
    </div>
    <noscript>
      <style>#hsk1-loading { display: none; }</style>
      <div class="startup-panel"><p>Hãy bật JavaScript và mở lại trò chơi trong Safari hoặc trình duyệt của bạn.</p></div>
    </noscript>
  </div>
</body>
</html>
